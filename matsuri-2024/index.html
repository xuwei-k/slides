## OSSか、それ以外か

- よほど巨大で活発でなければOSSではあまり問題にならない？
- OSSの種類にもよる
 - 広い意味でIOがないライブラリなら楽

---

## OSSか、それ以外か

- OSSは大抵GitHub Actionsなどで無料の範囲で済む
- よってOSSは富豪的に並列実行してることが多々
- 普通の？プロダクト開発とは全然異なる

## 普通の？プロダクト開発

- 通常CIのお金的コストがかかる
