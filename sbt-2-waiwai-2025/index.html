## 重要な前提知識

- sbt自体は大半のライブラリと異なり複数のscala versionでcross buildされていない
- sbt 1はScala 2.12
  - 言い換えるとsbt 1のbuildファイルはScala 2.13や3で書けない

class: middle

## 重要な前提知識

- あくまでsbt自体やpluginを作る時のversionであって、sbt 1自体はScala 3や2.13のbuildが可能
  - 初心者にとってややこしいポイント
- sbt 2がずっとリリースされないからScala 2.12のメンテがずっと続けられてる側面がある？

class: middle

## sbt 2の主な変更点

- Scala 2.12から3
- pluginをbuildし直さないと互換ない
- testのtaskの変更
- デフォルトでtaskがcacheされる
- taskのcacheのための変更
- common settingsなどの新機能

---
class: middle

## Scala 2.12から3

- おそらく一番重要な変更の1つ
- 基本的にbuildファイルを全てScala 3で書く必要がある
- buildファイルとは "なんとか.sbt" と "project/なんとか.scala" の全部
- 新機能でワイワイする前に、これとpluginの件含めて頑張って移行しないといけない

## testQuickとは？

- sbt 1以前から存在
- 前回失敗したか、新しく追加や変更してまだtestしてないものだけ実行
- 前回成功し、かつ変更されてないものはskip

- 今まで通り必ず全部実行するにはtestではなくtestFull
- sbt 1ではUnitだったのが値を返すようになった

## testのcache

- test結果もcompile結果と同様にremote cache可能になった
  - gRPC対応、Bazel互換
  - test結果というか、testQuickで実行するか判断するための情報、のcache
- もちろんremote cacheで共有するには追加の設定が必要
- remoteではなく同じマシン上で複数同じprojectをgit checkoutしても共有される可能性

---

- うまく設定すればCIで影響あるtestだけ実行になってCI時間短縮？？？
  - どの程度うまくいくのかは未知
- 雑にやるなら "HOME/.cache/sbt" を保存するだけでもいけるが、それはアリなのか良くわかってない
  - このpathはLinuxの場合でOS毎に異なる

## taskのcache

- 任意のtaskがデフォルトでcacheされる
- cacheされていいのか？はtask定義側の人間が考える必要がある
  - 言い換えるとtask定義に副作用があるか？
- cacheされたくない場合の記述方法が複数あり

class: middle

## 任意のtaskがデフォルトでcacheされる

- 結構攻めた変更だと思うので、慣れるまで、sbt自体やpluginが安定するまで、cache関連の問題に遭遇する可能性高い？
- cacheをclearする方法やcache使わないで実行する最低限の方法を把握しておく必要

---
class: middle

## [cacheされたくない<br/>場合の記述方法](https://www.scala-sbt.org/2.x/docs/en/reference/cached-task.html#opting-out-from-caching)

- project/plugins.sbtにscalacOptions指定で一括無効化
- taskKey定義時にアノテーション
  - アノテーションも複数ある
- taskの定義時に "Def.uncached" で囲う

---
class: middle

## taskのcacheのための変更

- java.io.Fileの型がVirtualFile, VirtualFileRef, HashedVirtualFileRefなどになってる場合がよくある
  - それらを使ってる場合は非互換変更
- task定義時にtype classのinstance要求される場合がある

---
class: middle

## VirtualFile関連

- sbt 1から存在していたがsbt 2で使われる箇所が増えた
- fileConverterでjava.nio.file.Pathと相互変換可能
- [sbt.Keys内部のfileConverter定義](https://github.com/sbt/sbt/blob/v2.0.0-RC7/main/src/main/scala/sbt/Keys.scala#L289)
- [FileConverterの型定義](https://github.com/sbt/zinc/blob/e41cf2d05a6c84d6d395a0b2a6facf4ffdac31f7/internal/compiler-interface/src/main/java/xsbti/FileConverter.java)

## cleanタスクで全てが<br/>cleanされなくなる!?

- デフォルトでproject毎のtarget以外の場所にcacheされるため
  - Macなら $HOME/Library/Caches/sbt
  - Linuxなら $HOME/.cache/sbt
- それ含めて全部をcleanしたい場合はcleanFull
  - [つい数日前に実装された](https://github.com/sbt/sbt/commit/d1e0a5a35d0105e65b4d172307714d71c1af27c8)

## sbt自体のbuildに使う<br/>Scala 3のversionとJDK

- lazy val実装でsun.misc.Unsafe使っててJDK 25以降警告出る
  - Scala 3.0から3.7
  - Scala 2はlazy val実装にはUnsafe使ってない
  - sbtは一旦無理やり抑制する引数渡すようにしたっぽいが
- [JDK 25での警告は他にも JEP472](https://github.com/sbt/sbt/issues/7634)
  - unix domain socket使うためのコード部分
